# Minimal reverse proxy in front of the Next.js container. This is here for
# the DevOps practice — a real deploy would put Vercel's own edge network in
# this role — but it demonstrates the pattern: TLS termination and static
# caching happen at this layer, the app layer stays dumb.

events {
  worker_connections 1024;
}

http {
  upstream nextjs_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name localhost;

    # Next.js's own build-hashed assets are immutable — cache them hard.
    location /_next/static/ {
      proxy_pass http://nextjs_app;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://nextjs_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # keep-alive upgrade headers, in case Next.js ever needs a websocket
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /api/health {
      proxy_pass http://nextjs_app;
      access_log off;
    }
  }
}
